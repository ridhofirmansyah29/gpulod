name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: gpulod-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
